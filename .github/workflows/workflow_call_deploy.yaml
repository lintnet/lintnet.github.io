---
name: Deploy (workflow_call)
on: workflow_call
permissions: {}
jobs:
  deploy-doc:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - uses: suzuki-shunsuke/release-doc-action@1cb15eb99aa8f0ae05ae28174430e49579e878fa # v0.2.0
        with:
          repository: lintnet/lintnet
          source_dir: website
          issue_number: 848
          publish_dir: website/build
          destination_dir: docs

